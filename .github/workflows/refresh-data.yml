# refresh-data.yml — 每周刷新 GitHub 数据快照,有变化才构建、部署、提交。
# 取代原先本机 launchd 方案:不依赖笔记本开机,失败在 Actions 页面显性可见。
name: refresh-data

on:
  schedule:
    - cron: "30 1 * * 1" # 每周一 01:30 UTC = 北京时间 09:30
  workflow_dispatch: # 也可在 Actions 页面手动触发

permissions:
  contents: write # 需要提交刷新后的快照

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # runner 已预装 gh CLI 与 python3。年度贡献走 GraphQL 的
      # contributionsCollection,已实测默认 GITHUB_TOKEN 权限足够;
      # 保留 GH_PAT(read:user)作为日后权限收紧时的退路。
      - name: 刷新数据快照
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/refresh-data.py | tee /tmp/refresh.log
          echo "summary=$(head -1 /tmp/refresh.log)" >> "$GITHUB_OUTPUT"

      - name: 检查快照是否有变化
        id: check
        run: |
          if git diff --quiet -- src/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "快照无变化,跳过构建与部署"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- src/
          fi

      - name: 构建
        if: steps.check.outputs.changed == 'true'
        run: ./build.sh

      # 先部署再提交:部署失败就不留提交,下一次运行会重试。
      - name: 部署 Cloudflare Workers
        if: steps.check.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: 提交并推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ dist/
          git commit -m "chore(data): refresh stats snapshot $(date -u +%F)"
          git push

      # 播报规则:失败必报;成功仅在真的部署了才报。「无变化」不打扰。
      # 未配置 Telegram secrets 时静默跳过,播报本身失败也不影响任务结论。
      - name: Telegram 播报
        if: failure() || steps.check.outputs.changed == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          STATUS: ${{ job.status }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "未配置 Telegram secrets,跳过播报"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            TEXT=$(printf '🧭 Homeport · 快照已刷新并部署\n\n%s\n\nbobochang.cn 已更新\n%s' \
                   "${SUMMARY:-(无摘要)}" "$RUN_URL")
          else
            TEXT=$(printf '⚠️ Homeport · 数据刷新失败(%s)\n\n线上站点未受影响,下周会自动重试。\n%s' \
                   "$STATUS" "$RUN_URL")
          fi
          ARGS=(--data-urlencode "chat_id=$TELEGRAM_CHAT_ID"
                --data-urlencode "text=$TEXT"
                --data-urlencode "disable_web_page_preview=true")
          if [ -n "$TELEGRAM_MESSAGE_THREAD_ID" ]; then
            ARGS+=(--data-urlencode "message_thread_id=$TELEGRAM_MESSAGE_THREAD_ID")
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
               "${ARGS[@]}" -o /dev/null -w 'telegram sendMessage: %{http_code}\n'
