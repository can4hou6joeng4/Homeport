<style>
/* ================================================================
   Bobochang homepage — design tokens
   ================================================================ */
:root {
  --accent-h: 292;
  --bg: oklch(10% 0.008 290);
  --bg-raise: oklch(14% 0.012 290);
  --panel: oklch(17% 0.014 290 / 0.82);
  --panel-solid: oklch(17% 0.014 290);
  --term-bg: oklch(8% 0.008 290);
  --line: oklch(92% 0.01 290 / 0.13);
  --line-strong: oklch(92% 0.01 290 / 0.24);
  --line-soft: oklch(92% 0.01 290 / 0.065);
  --ink: oklch(96% 0.006 290);
  --ink-dim: oklch(75% 0.016 290);
  --ink-faint: oklch(57% 0.018 290);
  --accent: oklch(70% 0.22 var(--accent-h));
  --accent-soft: oklch(70% 0.22 var(--accent-h) / 0.16);
  --accent-faint: oklch(70% 0.22 var(--accent-h) / 0.07);
  --pulse: oklch(72% 0.21 335);
  --status: oklch(82% 0.13 160);
  --cyan: oklch(82% 0.09 220);
  --shadow: 0 24px 70px oklch(0% 0 0 / 0.58);
  --font-display: "Space Grotesk", -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-body: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "PingFang SC", monospace;
  --radius: 8px;
  --maxw: 1200px;
  color-scheme: dark;
}

[data-theme="chart"] {
  --bg: oklch(96% 0.006 290);
  --bg-raise: oklch(99% 0.003 290);
  --panel: oklch(100% 0 0 / 0.88);
  --panel-solid: oklch(99% 0.003 290);
  --term-bg: oklch(19% 0.018 290);
  --line: oklch(22% 0.018 290 / 0.16);
  --line-strong: oklch(22% 0.018 290 / 0.28);
  --line-soft: oklch(22% 0.018 290 / 0.075);
  --ink: oklch(18% 0.018 290);
  --ink-dim: oklch(37% 0.02 290);
  --ink-faint: oklch(51% 0.018 290);
  --accent: oklch(54% 0.22 var(--accent-h));
  --accent-soft: oklch(54% 0.22 var(--accent-h) / 0.13);
  --accent-faint: oklch(54% 0.22 var(--accent-h) / 0.055);
  --pulse: oklch(57% 0.2 335);
  --status: oklch(55% 0.14 160);
  --cyan: oklch(54% 0.11 220);
  --shadow: 0 22px 58px oklch(24% 0.02 290 / 0.17);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  transition: background-color 0.35s ease, color 0.35s ease;
}

::selection { background: var(--accent); color: var(--bg); }
a { color: inherit; text-decoration: none; }
button { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
h1, h2, h3, p, blockquote { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.wrap { width: min(100%, var(--maxw)); margin-inline: auto; padding-inline: 32px; }
.page { position: relative; z-index: 1; }
.section, .hero { scroll-margin-top: 92px; }

/* Background field */
.chart-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.matrix-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 96px 96px;
  mask-image: linear-gradient(to bottom, black 0%, black 72%, transparent 100%);
}
.signal-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.76; }
.field-label { position: absolute; color: var(--ink-faint); opacity: 0.28; font: 10px/1 var(--font-mono); letter-spacing: 0; }
[data-contours="off"] .signal-canvas, [data-contours="off"] .field-label { display: none; }

/* Shared systems */
.status { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-faint); font: 10px/1.2 var(--font-mono); letter-spacing: 0; white-space: nowrap; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status); box-shadow: 0 0 12px color-mix(in oklab, var(--status) 70%, transparent); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-dim); font: 11px/1.2 var(--font-mono); letter-spacing: 0; }

/* Navigation */
.topbar { position: fixed; inset: 16px 0 auto; z-index: 60; padding-inline: 16px; }
.topbar-shell {
  width: min(100%, 920px); min-height: 50px; margin-inline: auto; padding: 7px 9px 7px 16px;
  display: flex; align-items: center; gap: 20px;
  border: 1px solid var(--line-strong); border-radius: 999px;
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(1.15); backdrop-filter: blur(20px) saturate(1.15);
  box-shadow: 0 14px 44px oklch(0% 0 0 / 0.22);
}
.wordmark { display: inline-flex; align-items: center; gap: 9px; font: 600 12px/1 var(--font-mono); letter-spacing: 0; white-space: nowrap; }
.wordmark svg { color: var(--accent); }
.nav { display: flex; align-items: center; justify-content: center; gap: 20px; flex: 1; }
.nav a { position: relative; padding: 6px 0; color: var(--ink-faint); font: 11px/1 var(--font-mono); letter-spacing: 0; transition: color 0.2s ease; }
.nav a::after { content: ""; position: absolute; inset: auto 50% 0; height: 1px; background: var(--accent); transition: inset 0.2s ease; }
.nav a:hover { color: var(--ink); }
.nav a:hover::after { inset-inline: 0; }
.controls { display: flex; align-items: center; gap: 7px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { min-width: 34px; padding: 6px 9px; color: var(--ink-faint); font: 10px/1 var(--font-mono); letter-spacing: 0; transition: color 0.2s ease, background-color 0.2s ease; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 50%; color: var(--ink-dim); transition: color 0.2s ease, border-color 0.2s ease; }
.icon-btn:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }

/* Hero */
.hero { min-height: 720px; height: calc(100svh - 104px); max-height: 860px; padding: 102px 0 24px; position: relative; }
.hero-wrap { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.hero-heading { position: relative; z-index: 12; text-align: center; }
.system-line { display: flex; align-items: center; justify-content: center; gap: 18px; color: var(--ink-faint); font: 10px/1 var(--font-mono); letter-spacing: 0; }
.hero-heading h1 { margin-top: 10px; font: 600 72px/0.98 var(--font-display); letter-spacing: 0; }
.roles { margin-top: 10px; color: var(--ink-dim); font: 12px/1.45 var(--font-mono); letter-spacing: 0; }
.hero-stage { position: relative; align-self: stretch; min-height: 530px; margin-top: 8px; perspective: 1200px; }
.stage-frame { position: absolute; inset: 8% 3% 6%; border: 1px solid var(--line); }
.stage-frame::before, .stage-frame::after { content: ""; position: absolute; width: 28px; height: 28px; border-color: var(--accent); opacity: 0.5; }
.stage-frame::before { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
.stage-frame::after { right: -1px; bottom: -1px; border-right: 1px solid; border-bottom: 1px solid; }
.core-glyph { position: absolute; left: 50%; top: 47%; width: 420px; height: 260px; transform: translate(-50%, -50%); opacity: 0.42; }
.core-ring { position: absolute; left: 50%; top: 50%; border: 1px solid color-mix(in oklab, var(--accent) 36%, transparent); transform: translate(-50%, -50%) rotate(45deg); }
.ring-a { width: 250px; height: 250px; }
.ring-b { width: 150px; height: 150px; border-color: color-mix(in oklab, var(--pulse) 32%, transparent); }
.core-diamond { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; background: var(--accent); transform: translate(-50%, -50%) rotate(45deg) skew(-8deg, -8deg); box-shadow: 0 0 54px var(--accent-soft); }
.diamond-b { width: 44px; height: 44px; margin: -17px 0 0 28px; background: var(--pulse); opacity: 0.68; }
.core-axis { position: absolute; left: 50%; top: 50%; background: color-mix(in oklab, var(--accent) 30%, transparent); }
.axis-x { width: 100%; height: 1px; transform: translate(-50%, -50%); }
.axis-y { width: 1px; height: 100%; transform: translate(-50%, -50%); }
@media (prefers-reduced-motion: no-preference) {
  html:not([data-motion="off"]) .core-diamond { animation: core-breathe 4.5s ease-in-out infinite; }
  html:not([data-motion="off"]) .ring-a { animation: ring-turn 28s linear infinite; }
  html:not([data-motion="off"]) .ring-b { animation: ring-turn-reverse 20s linear infinite; }
}
@keyframes core-breathe { 50% { filter: brightness(1.22); box-shadow: 0 0 82px var(--accent-soft); } }
@keyframes ring-turn { to { transform: translate(-50%, -50%) rotate(405deg); } }
@keyframes ring-turn-reverse { to { transform: translate(-50%, -50%) rotate(-315deg); } }

.hero-panel {
  position: absolute; z-index: 5; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--panel); -webkit-backdrop-filter: blur(24px) saturate(1.08); backdrop-filter: blur(24px) saturate(1.08);
  box-shadow: var(--shadow); transform-style: preserve-3d;
  transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.18s ease;
}
.hero-panel:hover { border-color: color-mix(in oklab, var(--accent) 46%, var(--line)); }
.panel-k { display: flex; align-items: center; justify-content: space-between; color: var(--ink-faint); font: 10px/1 var(--font-mono); letter-spacing: 0; }
.panel-k svg { color: var(--ink-dim); }
.load-panel { width: 278px; min-height: 302px; left: 5%; top: 50px; padding: 20px; transform: rotate(-4deg) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); }
.load-visual { height: 88px; margin: 20px 0 18px; display: flex; align-items: flex-end; gap: 5px; padding: 12px; border: 1px solid var(--line); overflow: hidden; }
.load-visual span { flex: 1; height: 30%; background: var(--accent); opacity: 0.34; }
.load-visual span:nth-child(2) { height: 72%; opacity: 0.62; }
.load-visual span:nth-child(3) { height: 48%; background: var(--pulse); opacity: 0.5; }
.load-visual span:nth-child(4) { height: 86%; opacity: 0.78; }
.load-panel h2, .topology-panel h2 { font: 600 20px/1.25 var(--font-display); letter-spacing: 0; }
.load-panel p, .topology-panel p { margin-top: 8px; color: var(--ink-dim); font-size: 12px; line-height: 1.65; }
.meter-row { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; color: var(--accent); font: 10px/1 var(--font-mono); }
.meter-row strong { color: var(--ink); font-weight: 500; }
.meter { height: 3px; margin-top: 8px; background: var(--line); overflow: hidden; }
.meter span { display: block; width: 92%; height: 100%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }

.operator-panel { width: 278px; right: 5%; top: 58px; padding: 18px; transform: rotate(4deg) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); }
.operator-head { display: flex; align-items: center; gap: 12px; }
.avatar { width: 42px; height: 42px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; background: var(--term-bg); color: var(--accent); font: 600 12px/1 var(--font-mono); }
.operator-head > div:last-child { display: grid; gap: 4px; }
.operator-head strong { font: 600 14px/1.2 var(--font-display); }
.operator-head span { color: var(--accent); font: 9px/1.2 var(--font-mono); }
.operator-state { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); color: var(--ink-faint); font: 9px/1.35 var(--font-mono); }

.core-panel { width: 480px; left: 50%; top: 142px; z-index: 9; transform: translateX(-50%) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); }
.core-head { min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line); font: 10px/1 var(--font-mono); color: var(--accent); }
.core-head > span:first-child { display: inline-flex; align-items: center; gap: 9px; }
.core-head i { width: 10px; height: 10px; border-radius: 50%; background: var(--term-bg); border: 1px solid var(--accent); box-shadow: inset 0 0 0 2px var(--panel-solid); }
.core-window { min-height: 220px; padding: 26px 26px 22px; background: color-mix(in oklab, var(--term-bg) 72%, transparent); }
.core-title-row { display: flex; align-items: center; gap: 9px; color: var(--accent); font: 10px/1 var(--font-mono); }
.core-window h2 { margin-top: 19px; white-space: pre-line; font: 600 31px/1.22 var(--font-display); letter-spacing: 0; }
.core-window p { margin-top: 12px; color: var(--ink-dim); font-size: 12px; line-height: 1.65; }
.core-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.btn { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border: 1px solid transparent; border-radius: 6px; font: 11px/1 var(--font-mono); transition: transform 0.2s ease, color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--accent); }
.btn-ghost { border-color: var(--line); color: var(--ink-dim); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.star-chip { color: var(--accent); }

.topology-panel { width: 254px; left: 19%; bottom: 10px; padding: 18px; z-index: 7; transform: rotate(-1.5deg) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); }
.topology-panel h2 { margin-top: 17px; }
.verify-line { display: flex; align-items: center; gap: 9px; margin-top: 17px; color: var(--ink-faint); font: 9px/1 var(--font-mono); }
.verify-line span { width: 8px; height: 8px; border: 1px solid var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-soft); }
.asset-panel { width: 300px; right: 15%; bottom: 16px; padding: 12px; display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 12px; z-index: 6; transform: rotate(2.5deg) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); }
.asset-art { height: 66px; position: relative; border: 1px solid var(--line); overflow: hidden; }
.asset-art span { position: absolute; width: 38px; height: 38px; background: var(--accent); transform: rotate(45deg); opacity: 0.52; }
.asset-art span:nth-child(1) { left: 9px; top: 18px; }
.asset-art span:nth-child(2) { left: 31px; top: 8px; background: var(--pulse); opacity: 0.42; }
.asset-art span:nth-child(3) { right: -8px; bottom: -16px; width: 54px; height: 54px; opacity: 0.24; }
.asset-panel > div:nth-child(2) { min-width: 0; display: grid; gap: 4px; }
.asset-k { color: var(--accent); font: 9px/1 var(--font-mono); }
.asset-panel strong { overflow: hidden; text-overflow: ellipsis; font: 500 12px/1.3 var(--font-mono); white-space: nowrap; }
.asset-panel > svg { color: var(--ink-faint); }
.hero-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; color: var(--ink-faint); font: 10px/1 var(--font-mono); }
.hero-foot a { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-dim); transition: color 0.2s ease; }
.hero-foot a:hover { color: var(--accent); }

/* Sections */
.section { position: relative; padding: 112px 0; border-top: 1px solid var(--line); }
.section-flagship { padding-top: 56px; }
.section-flagship .section-head { opacity: 1; translate: 0 0; }
.section:nth-of-type(even) { background: color-mix(in oklab, var(--bg-raise) 34%, transparent); }
.section-head { display: grid; grid-template-columns: 160px 1fr; column-gap: 30px; margin-bottom: 44px; }
.chart-no { grid-row: 1 / span 3; align-self: start; display: grid; gap: 12px; padding-top: 7px; color: var(--accent); font: 10px/1 var(--font-mono); }
.section-title-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; }
.section-title { font: 600 42px/1.1 var(--font-display); letter-spacing: 0; }
.section-alt { color: var(--ink-faint); font: 10px/1 var(--font-mono); text-transform: uppercase; }
.section-sub { margin-top: 10px; color: var(--ink-dim); font-size: 14px; }

/* Flagship */
.flagship-deck { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 16px; }
.flagship-overview, .terminal-panel, .ship-card, .stat, .operator-card, .stack-group, .mooring-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.flagship-overview { min-height: 520px; padding: 28px; display: flex; flex-direction: column; align-items: flex-start; transform: perspective(1000px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); transition: transform 0.18s ease, border-color 0.25s ease; }
.flagship-overview:hover { border-color: color-mix(in oklab, var(--accent) 44%, var(--line)); }
.flagship-signal { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font: 10px/1 var(--font-mono); }
.flagship-ident { width: 100%; margin-top: 48px; display: flex; align-items: center; justify-content: space-between; color: var(--ink-faint); font: 10px/1 var(--font-mono); }
.ship-mark { width: 48px; height: 48px; display: grid; place-items: center; flex: none; border: 1px solid var(--line); border-radius: 6px; background: var(--term-bg); font-size: 22px; }
.flagship-name { margin-top: 24px; font: 600 36px/1.12 var(--font-display); letter-spacing: 0; }
.flagship-stars { display: flex; align-items: center; gap: 9px; margin-top: 15px; }
.flagship-stars svg { color: var(--accent); }
.flagship-stars strong { color: var(--accent); font: 600 22px/1 var(--font-display); }
.flagship-stars span { color: var(--ink-faint); font: 10px/1 var(--font-mono); }
.flagship-desc { max-width: 42em; margin-top: 22px; color: var(--ink-dim); font-size: 14px; line-height: 1.8; }
.flagship-overview .chips { margin-top: 24px; }
.flagship-links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: auto; padding-top: 32px; }
.text-link { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-dim); font: 11px/1 var(--font-mono); transition: color 0.2s ease; }
.text-link:hover { color: var(--accent); }
.terminal-panel { min-height: 520px; padding: 0; overflow: hidden; background: color-mix(in oklab, var(--term-bg) 90%, transparent); }
.term-head { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line); }
.term-mode { color: var(--accent); font: 10px/1 var(--font-mono); }
.term-visual { position: relative; height: 176px; overflow: hidden; border-bottom: 1px solid var(--line); background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px); background-size: 26px 26px; }
.term-visual::before { content: ""; position: absolute; left: 50%; bottom: -16px; width: 250px; height: 190px; transform: translateX(-50%) perspective(350px) rotateX(58deg) rotate(45deg); border: 1px solid var(--accent); box-shadow: 0 0 42px var(--accent-soft), inset 0 0 42px var(--accent-faint); }
.term-visual::after { content: ""; position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; background: var(--accent); transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 0 30px var(--accent-soft); }
.term-visual span { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; background: var(--pulse); transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 0 10px var(--pulse); }
.term-visual span:nth-child(1) { margin: -58px 0 0 -102px; }
.term-visual span:nth-child(2) { margin: 46px 0 0 -121px; }
.term-visual span:nth-child(3) { margin: -42px 0 0 111px; }
.term-visual span:nth-child(4) { margin: 63px 0 0 92px; }
.term-visual span:nth-child(5) { margin: -72px 0 0 38px; }
.term-body { padding: 18px 22px 22px; color: var(--ink-dim); font: 12px/1.72 var(--font-mono); }
.term-body > div { white-space: pre-wrap; overflow-wrap: anywhere; }
.t-cmd { color: var(--ink); }
.t-cmd::before { content: "$ "; color: var(--accent); }
.t-out { color: var(--status); }
.t-json { color: var(--ink-faint); }

/* Fleet */

.captain-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }

.moorings-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.mooring-card { position: relative; min-height: 184px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; transition: transform 0.22s ease, border-color 0.22s ease; }

/* Tweaks */
.tweaks-fab { position: fixed; right: 20px; bottom: 20px; z-index: 70; width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: color-mix(in oklab, var(--bg) 82%, transparent); color: var(--ink-dim); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); transition: color 0.2s ease, border-color 0.2s ease; }

.tweaks-panel { position: fixed; right: 20px; bottom: 72px; z-index: 70; width: 274px; padding: 18px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: color-mix(in oklab, var(--panel-solid) 94%, transparent); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }

.tweak-row input[type="range"] { width: 120px; accent-color: var(--accent); }
.switch { position: relative; width: 34px; height: 18px; flex: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch span { position: absolute; inset: 0; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--line-soft); transition: background-color 0.2s ease, border-color 0.2s ease; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink-faint); transition: transform 0.2s ease, background-color 0.2s ease; }
.switch input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.switch input:checked + span::after { transform: translateX(16px); background: var(--accent); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }
.tweaks-reset { width: 100%; margin-top: 16px; min-height: 34px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink-faint); font: 10px/1 var(--font-mono); transition: color 0.2s ease, border-color 0.2s ease; }
.tweaks-reset:hover { color: var(--accent); border-color: var(--accent); }

/* Static fallback and motion */
#static-fleet { max-width: var(--maxw); margin: 110px auto 0; padding-inline: 32px; color: var(--ink-dim); font-size: 14px; line-height: 1.8; }

.reveal { opacity: 0; translate: 0 16px; transition: opacity 0.68s ease, translate 0.68s ease; transition-delay: var(--d, 0s); }
