<!DOCTYPE html>
<html lang="zh" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobochang · 开源船队 The Fleet</title>
<meta name="description" content="Bobochang — AI Agent 开发者、全栈工程师、开源维护者。一支开源船队，泊在同一片海。An open-source fleet, anchored in the same sea.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* ================================================================
   夜航海图 · Night Chart — design tokens
   ================================================================ */
:root {
  --accent-h: 62; /* 灯塔琥珀，Tweaks 面板可调 */

  --bg: oklch(20% 0.042 252);
  --bg-raise: oklch(23.5% 0.048 251);
  --panel: oklch(27% 0.05 250 / 0.5);
  --term-bg: oklch(16.5% 0.03 252);

  --line: oklch(72% 0.045 240 / 0.17);
  --line-soft: oklch(72% 0.045 240 / 0.085);

  --ink: oklch(94% 0.012 240);
  --ink-dim: oklch(79% 0.024 242);
  --ink-faint: oklch(63% 0.03 245);

  --accent: oklch(80% 0.135 var(--accent-h));
  --accent-deep: oklch(70% 0.145 var(--accent-h));
  --accent-glow: oklch(80% 0.135 var(--accent-h) / 0.24);
  --foam: oklch(83% 0.065 195);

  --shadow: 0 16px 40px oklch(8% 0.03 252 / 0.5);

  --font-display: "Space Grotesk", -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-body: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "PingFang SC", monospace;

  --radius: 14px;
  --maxw: 1120px;
  color-scheme: dark;
}

/* 纸海图 · Paper Chart(日间主题):奶油纸底 × 海军蓝墨线 */
[data-theme="chart"] {
  --bg: oklch(96.5% 0.017 88);
  --bg-raise: oklch(94% 0.02 86);
  --panel: oklch(99% 0.006 95 / 0.72);
  --term-bg: oklch(24% 0.045 252);

  --line: oklch(34% 0.055 250 / 0.24);
  --line-soft: oklch(34% 0.055 250 / 0.11);

  --ink: oklch(27% 0.05 252);
  --ink-dim: oklch(38% 0.045 250);
  --ink-faint: oklch(51% 0.038 248);

  --accent: oklch(58% 0.155 var(--accent-h));
  --accent-deep: oklch(50% 0.155 var(--accent-h));
  --accent-glow: oklch(58% 0.155 var(--accent-h) / 0.2);
  --foam: oklch(46% 0.085 210);

  --shadow: 0 14px 36px oklch(30% 0.04 252 / 0.16);
  color-scheme: light;
}

/* ================================================================
   Base
   ================================================================ */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color 0.45s ease, color 0.45s ease;
  overflow-x: hidden;
}
:lang(zh) body, body:lang(zh) { line-height: 1.8; }

::selection { background: var(--accent); color: var(--bg); }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }

.wrap { max-width: var(--maxw); margin-inline: auto; padding-inline: clamp(20px, 4.5vw, 48px); }
.page { position: relative; z-index: 1; }
.section, .hero { scroll-margin-top: 72px; }

/* ================================================================
   海图底纹：经纬网 + 等深线 + 水深注记
   ================================================================ */
.chart-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.graticule {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 148px 148px;
}
.contours { position: absolute; inset: 0; width: 100%; height: 100%; }
.contours path { fill: none; stroke: var(--ink); opacity: 0.055; vector-effect: non-scaling-stroke; }
.sounding {
  position: absolute; font-family: var(--font-mono); font-size: 11px;
  color: var(--ink); opacity: 0.1; letter-spacing: 0.08em;
}
[data-contours="off"] .chart-layer { display: none; }

/* ================================================================
   Topbar
   ================================================================ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: color-mix(in oklab, var(--bg) 78%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(1.15);
  backdrop-filter: blur(16px) saturate(1.15);
  border-bottom: 1px solid var(--line-soft);
}
.topbar-inner { display: flex; align-items: center; gap: 28px; height: 62px; }
.wordmark {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--font-display); font-weight: 600; font-size: 0.92rem;
  letter-spacing: 0.14em;
}
.wordmark svg { color: var(--accent); }
.nav { display: flex; gap: 24px; margin-left: 8px; }
.nav a {
  font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.1em;
  color: var(--ink-faint); padding: 4px 0; position: relative; transition: color 0.25s;
}
.nav a::after {
  content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1px;
  background: var(--accent); transition: right 0.3s ease;
}
.nav a:hover { color: var(--ink); }
.nav a:hover::after { right: 0; }
.controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.seg {
  display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
}
.seg button {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em;
  padding: 5px 12px; color: var(--ink-faint); transition: all 0.25s;
}
.seg button.on { background: color-mix(in oklab, var(--accent) 20%, transparent); color: var(--accent); }
.icon-btn {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 9px; color: var(--ink-dim);
  transition: all 0.25s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ================================================================
   Hero · 母港
   ================================================================ */
.hero { position: relative; padding-top: 168px; padding-bottom: 24px; }
.hero-inner { position: relative; }
.kicker {
  display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; gap: 14px;
  font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.22em;
  color: var(--ink-faint);
}
.kicker .rule { width: 38px; height: 1px; background: var(--accent); flex: none; }
.hero h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(58px, 9vw, 108px); line-height: 1.02; letter-spacing: -0.015em;
  margin: 0.16em 0 0.12em;
}
.hero h1 .dot { color: var(--accent); }
.roles { font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-dim); letter-spacing: 0.04em; }
.tagline {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(23px, 3.3vw, 36px); line-height: 1.4;
  margin-top: 38px; max-width: 22em; white-space: pre-line;
}
.tagline:lang(zh) { line-height: 1.55; letter-spacing: 0.01em; }
.bio {
  margin-top: 16px; max-width: 35em; color: var(--ink-dim);
  font-size: 0.98rem; line-height: 1.85;
}
.bio:lang(en) { line-height: 1.68; }
.cta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 40px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.03em;
  padding: 12px 22px; border-radius: 11px; border: 1px solid transparent;
  transition: all 0.3s ease;
}
.btn-primary { background: var(--accent); color: var(--bg); font-weight: 600; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 26px var(--accent-glow); }
.btn-ghost { border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn .star-chip { color: var(--accent); }
.btn-ghost:hover .star-chip { color: inherit; }

.compass {
  position: absolute; top: 96px; right: -30px; z-index: -1;
  width: min(36vw, 400px); opacity: 0.5; color: var(--ink-faint);
  pointer-events: none;
}
[data-theme="chart"] .compass { opacity: 0.65; }

/* 航线图 */
.routeline { margin-top: 76px; }
.route-caption {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.2em;
  color: var(--ink-faint); margin-bottom: 4px;
}
.routeline svg { display: block; width: 100%; height: auto; overflow: visible; }
.route-path {
  fill: none; stroke: var(--ink-faint); stroke-width: 1.2;
  stroke-dasharray: 3 8; stroke-linecap: round; opacity: 0.85;
}
.route-glow { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 8; stroke-linecap: round; opacity: 0; }
.route-dot { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; }
.route-dot.flag { fill: var(--accent); }
.route-name { font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-faint); letter-spacing: 0.06em; }
.route-star { font-family: var(--font-mono); font-size: 9px; fill: var(--accent); letter-spacing: 0.04em; }
@media (prefers-reduced-motion: no-preference) {
  html:not([data-motion="off"]) .route-path { animation: routeflow 30s linear infinite; }
}
@keyframes routeflow { to { stroke-dashoffset: -220; } }

/* ================================================================
   Sections
   ================================================================ */
.section { padding: 92px 0 4px; }
.section-head { margin-bottom: 46px; }
.chart-no {
  display: flex; align-items: center; gap: 16px;
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.3em;
  color: var(--accent); margin-bottom: 16px;
}
.chart-no::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.section-title-row { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.section-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(30px, 4.2vw, 42px); letter-spacing: -0.01em; line-height: 1.2;
}
.section-alt { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.18em; color: var(--ink-faint); text-transform: uppercase; }
.section-sub { margin-top: 12px; color: var(--ink-faint); font-size: 0.95rem; }

/* ================================================================
   旗舰 Flagship
   ================================================================ */
.flagship-card {
  position: relative; display: grid; grid-template-columns: 1.05fr 0.95fr;
  border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  background:
    radial-gradient(120% 150% at 0% 0%, var(--panel), transparent 55%),
    var(--bg-raise);
  transition: background-color 0.45s ease;
}
.flagship-left { padding: clamp(26px, 4vw, 44px); display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
.ship-mark {
  width: 54px; height: 54px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; line-height: 1;
  background: var(--bg); border: 1px solid var(--line-soft); border-radius: 13px;
}
.flagship-name {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(28px, 3.4vw, 38px); letter-spacing: -0.01em; line-height: 1.15;
}
.flagship-stars { display: flex; align-items: baseline; gap: 10px; }
.flagship-stars svg { color: var(--accent); transform: translateY(2px); }
.flagship-stars .num { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; color: var(--accent); letter-spacing: 0.01em; }
.flagship-stars .note { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.1em; }
.flagship-desc { color: var(--ink-dim); font-size: 0.97rem; line-height: 1.85; max-width: 34em; }
.flagship-desc:lang(en) { line-height: 1.68; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em;
  color: var(--ink-dim); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 11px;
}
.flagship-links { display: flex; gap: 24px; margin-top: 4px; }
.text-link {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 0.82rem; color: var(--accent);
  border-bottom: 1px solid transparent; transition: border-color 0.25s;
  padding-bottom: 2px;
}
.text-link:hover { border-color: var(--accent); }
.pennant {
  position: absolute; top: 22px; right: 22px; z-index: 2;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.22em;
  color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
  background: color-mix(in oklab, var(--accent) 10%, transparent);
  padding: 5px 12px; border-radius: 5px;
}

/* 终端演示 */
.term-wrap { display: flex; align-items: center; padding: clamp(18px, 3vw, 30px); }
.term {
  width: 100%; background: var(--term-bg); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
}
.term-head {
  display: flex; align-items: center; gap: 7px; padding: 11px 15px;
  border-bottom: 1px solid oklch(72% 0.045 240 / 0.1);
}
.term-head .td { width: 10px; height: 10px; border-radius: 50%; opacity: 0.85; }
.term-head .td:nth-child(1) { background: #ff5f57; }
.term-head .td:nth-child(2) { background: #febc2e; }
.term-head .td:nth-child(3) { background: #28c840; }
.term-title { margin-left: 8px; font-family: var(--font-mono); font-size: 0.68rem; color: oklch(63% 0.03 245); letter-spacing: 0.1em; }
.term-body { padding: 16px 18px 18px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.8; }
.term-body > div { white-space: pre-wrap; word-break: break-all; }
.t-cmd { color: oklch(93% 0.012 240); }
.t-cmd::before { content: "$ "; color: oklch(80% 0.135 62); }
.t-out { color: oklch(83% 0.065 195); }
.t-json { color: oklch(70% 0.026 242); }
.t-cursor { color: oklch(80% 0.135 62); }
.t-cursor::before { content: "$ "; }
.t-cursor::after { content: "▊"; }
@media (prefers-reduced-motion: no-preference) {
  html:not([data-motion="off"]) .t-cursor::after { animation: blink 1.15s steps(1) infinite; }
}
@keyframes blink { 50% { opacity: 0; } }

/* ================================================================
   编队 Fleet
   ================================================================ */
.fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 16px; }
.ship-card {
  position: relative; display: flex; flex-direction: column; gap: 12px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: color-mix(in oklab, var(--bg-raise) 80%, transparent);
  padding: 22px 22px 16px 26px; overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.3, 1), border-color 0.35s, box-shadow 0.35s, background-color 0.45s;
}
/* 船体吃水标记 */
.ship-card::before {
  content: ""; position: absolute; left: 9px; top: 16px; bottom: 16px; width: 5px;
  background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 9px);
}
/* 悬停水线 */
.ship-card::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent 72%);
  transform: scaleX(0); transform-origin: left; transition: transform 0.45s ease;
}
.ship-card:hover { transform: translateY(-4px); border-color: color-mix(in oklab, var(--accent) 42%, var(--line)); box-shadow: var(--shadow); }
.ship-card:hover::after { transform: scaleX(1); }
.ship-top { display: flex; gap: 13px; align-items: flex-start; }
.ship-card .ship-mark { width: 46px; height: 46px; font-size: 24px; border-radius: 11px; }
.ship-name { font-family: var(--font-display); font-weight: 600; font-size: 1.13rem; line-height: 1.25; }
.ship-image { font-family: var(--font-mono); font-size: 0.71rem; color: var(--ink-faint); margin-top: 3px; letter-spacing: 0.02em; }
.ship-desc { color: var(--ink-dim); font-size: 0.9rem; line-height: 1.8; flex: 1; }
.ship-desc:lang(en) { line-height: 1.62; }
.ship-meta {
  display: flex; align-items: center; gap: 13px;
  border-top: 1px solid var(--line-soft); padding-top: 12px;
  font-family: var(--font-mono); font-size: 0.73rem; color: var(--ink-faint);
}
.lang-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.meta-star { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
.ship-meta .spacer { flex: 1; }
.mini-link {
  width: 27px; height: 27px; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; color: var(--ink-faint); transition: all 0.25s;
}
.mini-link:hover { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }

.log-entry {
  margin-top: 38px; border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 24px 30px 26px; color: var(--ink-dim); font-size: 0.95rem; line-height: 2;
}
.log-entry:lang(en) { line-height: 1.75; }
.log-entry .log-k {
  display: block; font-family: var(--font-mono); font-size: 0.68rem;
  letter-spacing: 0.26em; color: var(--ink-faint); margin-bottom: 12px;
}

/* ================================================================
   航海日志 Logbook
   ================================================================ */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
.stat { border-top: 1px solid var(--line); padding-top: 20px; }
.stat svg { color: var(--accent); margin-bottom: 10px; }
.stat-num {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(34px, 4vw, 46px); letter-spacing: -0.01em; line-height: 1.1;
}
.stat-label { margin-top: 6px; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); }

.langmix { margin-top: 58px; }
.langmix-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.14em; color: var(--ink-faint);
  margin-bottom: 14px;
}
.langbar { display: flex; gap: 3px; height: 10px; }
.langbar span { border-radius: 3px; min-width: 4px; }
.lang-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; }
.legend-item {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-dim);
}
.legend-item .pct { color: var(--ink-faint); }

/* ================================================================
   船长室 Captain
   ================================================================ */
.captain-grid { display: grid; grid-template-columns: 1.08fr 0.92fr; gap: clamp(36px, 5vw, 64px); }
.captain-paras p { color: var(--ink-dim); font-size: 0.98rem; line-height: 2; margin-bottom: 18px; }
.captain-paras p:lang(en) { line-height: 1.75; }
.philosophy {
  margin-top: 26px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); padding: 24px 28px;
}
.philosophy .q { font-family: var(--font-display); font-weight: 500; font-size: 1.12rem; line-height: 1.7; }
.philosophy .src {
  display: flex; align-items: center; gap: 10px; margin-top: 14px;
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; color: var(--ink-faint);
}
.philosophy .src::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
.location-line {
  display: flex; align-items: center; gap: 9px; margin-top: 26px;
  font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-faint); letter-spacing: 0.05em;
}
.location-line svg { color: var(--accent); }
.stack-groups { display: flex; flex-direction: column; gap: 28px; }
.group-k {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.24em;
  color: var(--accent); margin-bottom: 13px;
}
.group-k::after { content: ""; width: 44px; height: 1px; background: var(--line); }
.stack-groups .chip { font-size: 0.78rem; padding: 6px 13px; }

/* ================================================================
   泊位 Moorings
   ================================================================ */
.moorings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); gap: 14px; }
.mooring-card {
  position: relative; display: flex; flex-direction: column; gap: 9px;
  border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 20px 18px;
  background: color-mix(in oklab, var(--bg-raise) 80%, transparent);
  transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.3, 1), border-color 0.35s, box-shadow 0.35s, background-color 0.45s;
}
.mooring-card:hover { transform: translateY(-4px); border-color: color-mix(in oklab, var(--accent) 42%, var(--line)); box-shadow: var(--shadow); }
.mooring-top { display: flex; align-items: center; gap: 10px; }
.mooring-top svg { color: var(--accent); flex: none; }
.mooring-name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.mooring-handle { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint); }
.mooring-note { font-size: 0.84rem; color: var(--ink-dim); }
.mooring-arrow {
  position: absolute; top: 16px; right: 16px; color: var(--ink-faint);
  opacity: 0; transform: translate(-4px, 4px); transition: all 0.3s ease;
}
.mooring-card:hover .mooring-arrow { opacity: 1; transform: none; color: var(--accent); }

/* ================================================================
   Footer
   ================================================================ */
.footer { margin-top: 96px; }
.waves { display: block; width: 100%; height: 44px; color: var(--ink-faint); }
.waves path { fill: none; stroke: currentColor; stroke-width: 1; }
.footer-inner {
  display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 26px 0 44px;
  font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-faint); letter-spacing: 0.04em;
}
.surface-link { display: inline-flex; align-items: center; gap: 7px; transition: color 0.25s; }
.surface-link:hover { color: var(--accent); }

/* ================================================================
   Tweaks 面板
   ================================================================ */
.tweaks-fab {
  position: fixed; bottom: 22px; right: 22px; z-index: 60;
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.18em;
  padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  color: var(--ink-faint); transition: all 0.25s;
}
.tweaks-fab:hover, .tweaks-fab.on { color: var(--accent); border-color: var(--accent); }
.tweaks-panel {
  position: fixed; bottom: 70px; right: 22px; z-index: 60; width: 252px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: color-mix(in oklab, var(--bg-raise) 94%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: var(--shadow); padding: 18px 18px 14px;
  animation: rise 0.28s cubic-bezier(0.2, 0.7, 0.3, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.tweaks-title {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.24em;
  color: var(--accent); margin-bottom: 14px;
}
.tweak-row {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  margin: 13px 0; font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-dim);
}
.tweak-row input[type="range"] { width: 108px; accent-color: var(--accent); }
.tweak-row input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
.tweaks-reset {
  width: 100%; margin-top: 6px; padding: 7px 0; border: 1px solid var(--line); border-radius: 9px;
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--ink-faint);
  transition: all 0.25s;
}
.tweaks-reset:hover { color: var(--accent); border-color: var(--accent); }

/* ================================================================
   入场动画
   ================================================================ */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.75s ease, transform 0.75s ease; transition-delay: var(--d, 0s); }
.reveal.revealed { opacity: 1; transform: none; }
html[data-motion="off"] .reveal { opacity: 1; transform: none; transition: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}

/* ================================================================
   Responsive
   ================================================================ */
@media (max-width: 1020px) {
  .compass { display: none; }
}
@media (max-width: 900px) {
  .nav { display: none; }
  .flagship-card { grid-template-columns: 1fr; }
  .term-wrap { padding-top: 0; }
  .captain-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .hero { padding-top: 132px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .section { padding-top: 72px; }
  .route-name { display: none; }
  .kicker .sep { display: none; }
  .tagline { white-space: normal; }
}
</style>
</head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
